[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stampver"
version = "0.1.0"
description = "Universal date-first versioning and build stamping CLI tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stampver = "stampver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["stampver"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
